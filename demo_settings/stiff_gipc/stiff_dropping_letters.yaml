# Stiff dropping letters benchmark (9 letter objects)
material:
  E: 1.0e4
  nu: 0.4
  density: 1000.0
  elastic_type: NH

solver:
  epsilon: 1e-3
  iter_max: 100
  dt: 0.005

scene:
  ground_height: 0.0
  gravity: -9.8
  meshes:
    - path: ../model/mesh/letters/letters.node
      scale: [0.44, 0.44, 0.44]
      count: 9
      translations:
        - [0.017, -0.7, 0.0]
        - [0.017, -0.35, 0.0]
        - [0.017, 0.0, 0.0]
        - [0.017, 0.35, 0.0]
        - [0.017, 0.7, 0.0]
        - [0.017, 1.05, 0.0]
        - [0.017, 1.4, 0.0]
        - [0.017, 1.75, 0.0]
        - [0.017, 2.1, 0.0]

ipc:
  enabled: true
  dHat: 0.002
  kappa: 1.0
  ground_barrier: true
