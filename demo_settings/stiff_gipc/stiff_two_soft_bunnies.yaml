# Two soft bunnies benchmark
material:
  E: 1.0e4
  nu: 0.4
  density: 1000.0
  elastic_type: NH

solver:
  epsilon: 1e-4
  iter_max: 100
  dt: 0.01

scene:
  ground_height: 0.1
  gravity: -9.8
  meshes:
    - path: ../model/mesh/bunny_stiff/bunny_stiff.node
      scale: [0.2, 0.2, 0.2]
      translation: [0.0, 0.5, 0.0]
    - path: ../model/mesh/bunny_stiff/bunny_stiff.node
      scale: [0.2, 0.2, 0.2]
      translation: [0.0, -0.65, 0.0]

ipc:
  enabled: true
  dHat: 0.01
  kappa: 1.0
  ground_barrier: true
