# Stiff-GIPC Scene 0: 4 octopuses stacked vertically
material:
  E: 1.0e6
  nu: 0.4
  density: 1000.0
  elastic_type: NH

solver:
  epsilon: 1e-4
  iter_max: 100
  dt: 0.01

scene:
  ground_height: 0.1
  gravity: -9.8
  meshes:
    - path: ../model/mesh/octopus/octopus.node
      count: 4
      rotation: [-90.0, 0.0, 0.0]
      translations:
        - [0.0, 0.0, -0.65]
        - [0.0, 0.0, -0.35]
        - [0.0, 0.0, -0.05]
        - [0.0, 0.0, 0.25]

ipc:
  enabled: true
  dHat: 0.01
  kappa: 1.0
  ground_barrier: true
