# Unit test: Wedge and spike collision
material:
  E: 1.0e5
  nu: 0.4
  density: 100.0
  elastic_type: NH

solver:
  epsilon: 1e-7
  iter_max: 100
  dt: 0.04

scene:
  ground_height: 0.0
  gravity: -9.8
  meshes:
    - path: ../model/mesh/wedge/wedge.node
      translation: [0.0, 0.0, 0.0]
    - path: ../model/mesh/spike/spike.node
      rotation: [180.0, 0.0, 0.0]
      translation: [0.0, 6.5, 0.0]
  camera_position: [-2.56836436, 3.19896263, 4.71955579]
  camera_lookat: [-2.36268801, 3.13648799, 3.74293193]

ipc:
  enabled: true
  dHat: 0.1
  kappa: 5.0
  ground_barrier: false
