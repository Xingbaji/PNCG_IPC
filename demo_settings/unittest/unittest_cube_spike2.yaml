# Unit test: cube vs spike (variant 2)
material:
  E: 1.0e5
  nu: 0.4
  density: 100.0
  elastic_type: NH

solver:
  epsilon: 1e-6
  iter_max: 100
  dt: 0.04

scene:
  ground_height: 0.0
  gravity: -9.8
  meshes:
    - path: ../model/mesh/cube/cube.node
      scale: [8.0, 8.0, 8.0]
      translation: [-1.0, 0.0, -1.0]
    - path: ../model/mesh/spike/spike.node
      rotation: [0.0, 0.0, 180.0]
      scale: [0.5, 0.5, 0.5]
      translation: [0.0, 8.0, 0.0]
  camera_position: [2.41025122, 4.40999399, 0.11444951]
  camera_lookat: [1.48162284, 4.04749814, 0.03541727]

ipc:
  enabled: true
  dHat: 0.1
  kappa: 4.0
  ground_barrier: false
