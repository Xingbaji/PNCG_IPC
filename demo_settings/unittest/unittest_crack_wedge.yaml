# Unit test: Crack and wedge collision
material:
  E: 1.0e5
  nu: 0.4
  density: 100.0
  elastic_type: SNH

solver:
  epsilon: 1e-6
  iter_max: 100
  dt: 0.04

scene:
  ground_height: 0.0
  gravity: -9.8
  meshes:
    - path: ../model/mesh/crack/crack.node
      translation: [0.0, 0.0, 0.0]
    - path: ../model/mesh/wedge/wedge.node
      rotation: [0.0, 0.0, 180.0]
      translation: [0.0, 4.0, 0.0]
  camera_position: [1.60707535, 2.84365887, -6.085546]
  camera_lookat: [1.61414123, 2.51783351, -5.14014243]

ipc:
  enabled: true
  dHat: 0.1
  kappa: 20.0
  ground_barrier: false
