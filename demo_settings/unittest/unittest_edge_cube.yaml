# Unit test: edge vs cube
material:
  E: 1.0e5
  nu: 0.4
  density: 100.0
  elastic_type: NH

solver:
  epsilon: 1e-10
  iter_max: 100
  dt: 0.04

scene:
  ground_height: 0.0
  gravity: -9.8
  meshes:
    - path: ../model/mesh/internal_edges/internal_edges.node
    - path: ../model/mesh/cube/cube.node
      translation: [0.0, 1.2, 0.0]
  camera_position: [0.10797674, 1.26187121, 2.66060623]
  camera_lookat: [0.08302997, 1.16211794, 1.68107763]

ipc:
  enabled: true
  dHat: 0.05
  kappa: 1.0
  ground_barrier: false
