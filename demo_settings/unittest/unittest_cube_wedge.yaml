# Unit test: cube vs wedge
material:
  E: 1.0e5
  nu: 0.4
  density: 100.0
  elastic_type: NH

solver:
  epsilon: 1e-6
  iter_max: 100
  dt: 0.04

scene:
  ground_height: 0.0
  gravity: -9.8
  meshes:
    - path: ../model/mesh/cube/cube.node
      scale: [16.0, 16.0, 16.0]
      translation: [1.0, 0.0, 1.0]
    - path: ../model/mesh/wedge/wedge.node
      rotation: [0.0, 0.0, 180.0]
      translation: [0.0, 12.0, 0.0]
  camera_position: [-5.865148, 9.39438321, 0.08294428]
  camera_lookat: [-4.92039291, 9.1154104, -0.08913708]

ipc:
  enabled: true
  dHat: 0.2
  kappa: 20.0
  ground_barrier: false
