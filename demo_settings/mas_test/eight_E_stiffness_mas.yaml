# MAS Stiffness Test: 8 E objects (high stiffness E=1e7, MAS enabled)
material:
  E: 1.0e7
  nu: 0.4
  density: 50.0
  elastic_type: SNH

solver:
  epsilon: 1e-4
  iter_max: 200
  dt: 0.01

scene:
  ground_height: 0.5
  gravity: -9.8
  meshes:
    - path: ../model/mesh/e_2/e_2.node
      grid:
        rows: 4
        cols: 2
        spacing: [1.5, 1.5, 0]
  camera_position: [2.02077697, -0.54062709, 2.59427191]
  camera_lookat: [1.34371885, -0.79285719, 1.90291651]

ipc:
  enabled: true
  dHat: 0.025
  kappa: 0.5
  ground_barrier: true

use_mas: true
